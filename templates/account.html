<!--accounts.html
An account page that will display all of the workshops the user has enrolled in-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account</title>
    <!-- Bootstrap CSS for layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'navbar.html' %}

    <!--main container-->
    <div class = "container">
        <div class="card shadow-sm mx-auto mt-5" style="max-width: 450px;">
            <div class="card-body">
                <!--main title-->
                <h3 class="card-title text-center mb-4 text-primary">Account Info</h3>
                <!--Message and button to redirect user to login-->
                <p class="text-center mb-4">Welcome back, <strong>{{ session.get('user_name') }}</strong>!</p>

                <!--Enrolled workshop section-->
                <hr>
                <h4 class="text-center mb-4">Enrolled Workshops</h4>
                <!--example workshops; need to connect to db when finished-->
                <ul class="list-group">
                    <!--The format will be workshop name on the left, and the ID number on the right-->
                    <li class="list-group-item">Flexing Workshop<span class="text-muted float-end">ID: 1</span></li>
                    <li class="list-group-item">Junk Journaling 101<span class="text-muted float-end">ID: 2</span></li>
                </ul>
                        <!-- OR if the person isnt enrolled in any workshops-->
                        <!--<li class="list-group-item text-muted text-center">You have not enrolled in any workshops yet.</li>-->

                <!--Browse workshops button that navigates back to workshops page-->
                <hr>
                <p class="text-center mb-4">Want to enroll in more workshops?</p>
                <a href="/workshop" class="btn btn-primary w-100">Browse Workshops</a>
                        
            </div>
        </div>
    </div>
</body>
</html>
