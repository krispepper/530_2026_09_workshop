<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Project Dashboard</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/workshop">Workshops</a>
                <a class="nav-link" href="/message">Messages</a>
                <a class="nav-link" href="/register">Register</a>
                <a class="nav-link active" href="/login">Login</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm mx-auto mt-5" style="max-width: 450px;">
            <div class="card-body">
                <h3 class="card-title text-center mb-4 text-primary">User Login</h3>
                
                <!-- Quick Reminder Alert for Development -->
                <div class="alert alert-info text-center py-2 mb-3" role="alert" style="font-size: 0.9rem;">
                    <strong>Default Password:</strong> <code>password123</code>
                </div>

                <!-- Display error message if login fails -->
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert alert-danger" role="alert">
                            {{ messages[0] }}
                        </div>
                    {% endif %}
                {% endwith %}

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
