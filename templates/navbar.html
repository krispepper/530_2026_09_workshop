<!--CSS styling for dropdown-->
<style>
  /*Positioning dropdown bar undrneath account*/
  .acc-dropdown{
    position: relative;
  }
  /*default: hides all dropdown content*/
  .dropdown-content{
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 180px;
    background-color: cornflowerblue;
    z-index: 1000;
    border-radius: 15%;
    padding: 10%;
  }
  /*the dropdown content and the text color*/
  .dropdown-content a{
    display: block;
    padding: 10px;
    color: white;
    text-decoration: none;
    text-align: justify;
  }
  /*When hovering over account, the content will be revealed*/
    .acc-dropdown:hover .dropdown-content,
    .acc-dropdown:focus-within .dropdown-content{
      display: block;
  }
</style>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="container mt-3">
      {% for message in messages %}
        <div class="alert alert-info alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
