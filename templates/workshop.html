<!-- Purpose: Workshop management interface template allowing users to create hosts, locations, workshops, and schedule time slots. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workshop Management</title>
    <!-- Bootstrap CSS for layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'navbar.html' %}
    
    <div class="card shadow-sm mx-auto mt-4" style="max-width: 600px;">
        <div class="card-body">
            <!--main title-->
            <h3 class="card-title text-center mb-4 text-primary">Create Workshop</h3>
            
            <!-- Location Form Card -->
            
            <h5 class="card-title text-success">1. Create Location<span class="text-danger">*</span></label></h5>
                <!-- Form submitting to create a new workshop location -->
                <form action="/createLocation" method="POST">
                <input type="text" class="form-control mb-2" name="location_name" placeholder="Room Name" required>
                <input type="number" class="form-control mb-3" name="capacity" placeholder="Capacity" required>
                <button type="submit" class="btn btn-success w-100">Add Location</button>
                </form>
                <hr>
            <!-- Workshop Form Card -->
                <h5 class="card-title text-primary">2. Create Workshop<span class="text-danger">*</span></label></h5>
                    <!-- Form submitting to create a new workshop linked to a host -->
                    <form action="/createWorkshop" method="POST">
                        <select class="form-select mb-2" name="hostID" required>
                             <option value="" disabled selected>Select Host</option>
                             {% for host in hosts %}
                                <option value="{{ host[0] }}">{{ host[1] }}</option>
                            {% endfor %}
                        </select>
                        <input type="text" class="form-control mb-3" name="workshop_name" placeholder="Workshop Name" required>
                        <button type="submit" class="btn btn-primary w-100">Create Workshop</button>
                    </form>
                    <hr>
            <!-- Time Slot Form Card -->
                        <h5 class="card-title text-primary">3. Create Time Slot<span class="text-danger">*</span></label></h5>
                        <!-- Form submitting to schedule a new workshop time slot -->
                        <form action="/createTimeslot" method="POST">
                            <select class="form-select mb-2" name="workshop_id" required>
                                <option value="" disabled selected>Select Workshop</option>
                                {% for workshop in workshops %}
                                    <option value="{{ workshop[0] }}">{{ workshop[1] }}</option>
                                {% endfor %}
                            </select>
                            <select class="form-select mb-2" name="location_id" required>
                                <option value="" disabled selected>Select Location</option>
                                {% for location in locations %}
                                    <option value="{{ location[0] }}">{{ location[1] }}</option>
                                {% endfor %}
                            </select>
                            <input type="datetime-local" class="form-control mb-2" name="session_datetime" required>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" name="is_public">
                                <label class="form-check-label">Is Public?</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Create Time Slot</button>
                        </form>
        
    </div>
    <!-- Bootstrap JS is required to allow the flash message close button to work -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
