<!--accounts.html
An account page that will display all of the workshops the user has enrolled in-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account</title>
    <!-- Bootstrap CSS for layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'navbar.html' %}

    <!--main container-->
    <div class = "container">
        <div class="card shadow-sm mx-auto mt-5" style="max-width: 450px;">
            <div class="card-body">
                <!--main title-->
                <h3 class="card-title text-center mb-4 text-primary">Account Info</h3>
                <!--Message and button to redirect user to login-->
                <p class="text-center mb-4">Welcome, <strong>{{ session.get('user_name') }}</strong>!</p>
                
            </div>
        </div>
    </div>
</body>
</html>
