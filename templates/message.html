<!-- Purpose: Message submission template providing a form for users to enter and send messages. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Message</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Project Dashboard</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/workshop">Workshops</a>
                <a class="nav-link" href="/message">Messages</a>
                <a class="nav-link" href="/change-password">Change Password</a>
                <a class="nav-link" href="/enroll">Enroll</a>
                <a class="nav-link text-danger" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Container for Message Form -->
    <div class="container">
        <div class="card shadow-sm mx-auto mt-5" style="max-width: 500px;">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Send a Message</h3>
                <!-- Form submitting message content to the /createMessage route -->
                <form action="/createMessage" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Message Content</label>
                        <input type="text" class="form-control" name="message" placeholder="Enter your message" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Submit Message</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
