<!-- Purpose: Login template providing a secure authentication form for existing users to sign in. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- Bootstrap CSS for layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'navbar.html' %}

    <div class="container">
        <div class="card shadow-sm mx-auto mt-5" style="max-width: 450px;">
            <div class="card-body">
                <h3 class="card-title text-center mb-4 text-primary">User Login</h3>
                
                <!-- Quick Reminder Alert for Development -->
                <div class="alert alert-info text-center py-2 mb-3" role="alert" style="font-size: 0.9rem;">
                    <strong>Default Password:</strong> <code>password123</code>
                </div>

                <!-- Display flashed error message if login authentication fails -->
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert alert-danger" role="alert">
                            {{ messages[0] }}
                        </div>
                    {% endif %}
                {% endwith %}

                <!-- Login Form submitting credentials to the /login route -->
                <form action="/login" method="POST">
                    <!-- Email Input Field -->
                    <div class="mb-3">
                        <label class="form-label">Email Address<span class="text-danger">*</span></label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <!-- Password Input Field -->
                    <div class="mb-4">
                        <label class="form-label">Password<span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
