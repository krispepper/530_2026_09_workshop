<!-- Purpose: Enrollment template providing a selection form for users to register for available public or private workshop time slots. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enroll in Workshop</title>
    <!-- Bootstrap CSS for layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'navbar.html' %}
    
    <!-- Main Container -->
    <div class="container">
        <div class="card shadow-sm mx-auto mt-5" style="max-width: 600px;">
            <div class="card-body">
                <h3 class="card-title text-center mb-4 text-primary">Enroll in a Workshop</h3>
                <!-- Dynamic greeting displaying the logged-in user's name from session data -->
                <p class="text-center text-muted mb-4">Welcome, <strong>{{ session.get('user_name') }}</strong>! Select an available workshop below.</p>
                
                <!-- Enrollment submission form pointing to /createEnrollment route -->
                <form action="/createEnrollment" method="POST">
                    <label class="form-label text-primary fw-bold">Available Workshops (Public & Private Invites)</label>
                    <select class="form-select mb-4" name="timeslot_id" required>
                        <option value="" disabled selected>Choose a workshop to join...</option>
                        <!-- Iterate through available workshop time slots and indicate visibility status -->
                        {% for slot in slots %}
                            <option value="{{ slot[0] }}">
                                {{ slot[1] }} | {{ slot[2] }} | {{ slot[3] }} 
                                {% if slot[4] == 1 %}(Public){% else %}(Private Invite){% endif %}
                            </option>
                        {% endfor %}
                    </select>
                    
                    <!-- Confirmation Button -->
                    <button type="submit" class="btn btn-primary w-100">Confirm Enrollment</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
