<!-- Purpose: Registration template providing a form for new users to create an account with personal and permission details. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <!-- Bootstrap CSS for layout styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'navbar.html' %}

    <div class="container">
        <div class="card shadow-sm mx-auto mt-5" style="max-width: 600px;">
            <div class="card-body">
                <h3 class="card-title text-center mb-4 text-primary">Register New User</h3>
                
                <!-- Registration Form submitting to /createUser route -->
                <form action="/createUser" method="POST">
                    <div class="row">
                        <!-- First Name Input Field -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label><span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="firstName" required>
                        </div>
                        <!-- Last Name Input Field -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="lastName" required>
                        </div>
                    </div>
                    
                    <!-- Email Address Input Field -->
                    <div class="mb-3">
                        <label class="form-label">Email Address<span class="text-danger">*</span></label>
                        <input type="email" class="form-control" name="email" required>
                    </div>

                    <!-- Password Input Field -->
                    <div class="mb-3">
                        <label class="form-label">Password<span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <!-- Optional Phone Number Input Field -->
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" name="phonenumber">
                    </div>

                    <!-- Permissions Level Selection Dropdown -->
                    <div class="mb-4">
                        <label class="form-label">Permissions Level<span class="text-danger">*</span></label>
                        <select class="form-select" name="perms" required>
                            <option value="student">Student</option>
                            <option value="faculty">Faculty</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
