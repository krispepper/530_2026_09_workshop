<!-- Purpose: Displays available timeslots for a specific workshop so the user can enroll. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select a Timeslot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'navbar.html' %}

    <div class="container mt-5">
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            Workshop Host: {{ timeslotRoster[0][6] }} Workshop ID: {{ timeslotRoster[0][1] }} Workshop Name: {{ timeslotRoster[0][7] }}
        </div>
       {% for item in timeslotRoster %}
                    <div class="alert alert-info alert-dismissible fade show" role="alert">
                        ID: {{ item[0] }} First Name: {{ item[2] }} Last Name: {{ item[3] }} Permission Level: {{ item[4] }}  
                    </div>
        {% endfor %}
        
    
    </div>

    <!-- Bootstrap JS is required to allow the flash message close button to work -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
