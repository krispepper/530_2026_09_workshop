<!-- Purpose: Change password template providing a form for authenticated users to update their account password. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <!-- Bootstrap CSS for layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'navbar.html' %}

    <!-- Main Container -->
    <div class="container">
        <div class="card shadow-sm mx-auto mt-5" style="max-width: 450px;">
            <div class="card-body">
                <h3 class="card-title text-center mb-4 text-primary">Change Password</h3>
                
                <!-- Password Update Form submitting to /change-password route -->
                <form action="/change-password" method="POST">
                    <div class="mb-4">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control" name="new_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
